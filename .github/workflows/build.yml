name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Instalar dependencias del sistema operativo para OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip \
          libffi-dev libssl-dev cmake gettext ffmpeg zlib1g-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Aceptar licencias e instalar Android Build-Tools
      run: |
        # Crear directorio de licencias para evitar bloqueos
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Instalar build-tools versión 33.0.2 (compatible con android.api = 33)
        ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"
    
    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
