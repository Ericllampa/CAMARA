name: Compilar APK con Buildozer

on:
  push:
    branches: [main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Generar buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = POS San Luis
        package.name = possanluis
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy,kivymd,sqlite3,android
        android.permissions = CAMERA,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        orientation = portrait
        fullscreen = 0
        android.api = 33
        android.minapi = 21
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF

    - name: Compilar APK dentro del contenedor
      env:
        BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT: 1
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        yes | buildozer -v android debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: pos-sanluis-apk
        path: bin/*.apk
