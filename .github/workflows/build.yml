name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip \
          libffi-dev libssl-dev cmake gettext ffmpeg zlib1g-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Aceptar licencias de Android SDK
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Automatisar la aceptación de todas las licencias
        yes | buildozer android debug --only-update-sdk || true

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
