name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          libpng-dev \
          libfreetype6-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          cmake \
          zip \
          unzip

    - name: Instalar Buildozer y Cython compatibles
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Eliminar caché previa de Buildozer
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    - name: Compilar APK
      env:
        ANDROID_NDK_HOME: ''
        ANDROID_NDK_ROOT: ''
        ANDROID_NDK: ''
      run: |
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
